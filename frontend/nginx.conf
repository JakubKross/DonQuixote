server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx:alpine's bundled mime.types has no entry for .mjs, so it falls
    # back to application/octet-stream — browsers refuse to execute that as
    # an ES module (the MapLibre worker at /maplibre-gl/*.mjs, copied in by
    # the frontend's `postinstall` script, is an ES module), failing
    # silently with a generic "Worker failed to load" in the console.
    location ~ \.mjs$ {
        default_type application/javascript;
    }

    # React Router (BrowserRouter) serves client-side routes like
    # /screenings/<uuid> — without this fallback, a direct load or a
    # refresh on such a path would 404 at the nginx level, since no such
    # file exists on disk.
    location / {
        try_files $uri /index.html;
    }
}
