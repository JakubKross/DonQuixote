name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Check Alembic migration renders (offline, no DB needed)
        run: |
          pip install -e ".[postgres]"
          DATABASE_URL="postgresql+psycopg://user:pass@localhost/donquixote" \
            alembic upgrade head --sql

  test-postgres:
    # Separate job: the postgres-marked tests spin up a real PostGIS
    # container via testcontainers, which needs a reachable Docker daemon —
    # available on GitHub-hosted ubuntu runners, unlike some local dev
    # environments (where the tests skip cleanly instead, see
    # docs/WEB_ARCHITECTURE.md section 3.4).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev,postgres]"

      - name: Run PostGIS adapter tests
        run: pytest -m postgres -v
