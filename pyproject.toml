[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "donquixote"
version = "0.1.0"
description = "Program wspomagający planowanie instalacji OZE"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "geopandas>=1.0",
    "pyproj>=3.5",
    "shapely>=2.0",
    "PyYAML>=6.0",
]

[project.scripts]
donquixote = "renewable_planner.cli:main"
renewable-planner = "renewable_planner.cli:main"
donquixote-worker = "renewable_planner.worker:main"


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "testcontainers[postgres]>=4.7",
]
pywake = [
    "py-wake>=2.6",
]
pvlib = [
    "pvlib>=0.11",
]
streamlit = [
    "streamlit>=1.38",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
postgres = [
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
]
markers = [
    "pywake: integration tests requiring the optional PyWake dependency",
    "pvlib: integration tests requiring the optional pvlib dependency",
    "web: integration tests requiring the optional FastAPI/web dependency",
    "postgres: integration tests requiring Docker (testcontainers PostGIS)",
]


[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_site_packages = true
ignore_missing_imports = true
